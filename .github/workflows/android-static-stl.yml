name: Build OpenCV Android libopencv_java4.so (Static STL)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenCV
        uses: actions/checkout@v4

      - name: Set up Python 3.10 with pip and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install numpy

      - name: Download Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip -d $HOME/
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> $GITHUB_ENV

      - name: Create build directory
        run: mkdir build_android

      - name: Configure CMake for Android
        run: |
          cd build_android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAVA=ON \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_world=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_IPP=OFF \
            -DPYTHON3_EXECUTABLE=$(which python3) \
            -DPYTHON3_INCLUDE_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_path('include'))") \
            -DPYTHON3_LIBRARY=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))") \
            ../

      - name: Build OpenCV
        run: |
          cd build_android
          make -j$(nproc)

      - name: Verify libopencv_java4.so exists
        run: ls -la ./build_android/jni/arm64-v8a/libopencv_java4.so

      - name: Upload libopencv_java4.so
        uses: actions/upload-artifact@v4
        with:
          name: libopencv_java4-arm64-static
          path: build_android/jni/arm64-v8a/libopencv_java4.so
