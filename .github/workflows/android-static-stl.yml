name: Build OpenCV Android SDK (Static STL)

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenCV
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Download Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip -d $HOME/
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build OpenCV Android SDK
        run: |
          cd platforms/android
          python build_sdk.py \
            --ndk_path "$ANDROID_NDK_HOME" \
            ./output

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: opencv-android-sdk-static
          path: platforms/android/output/OpenCV-android-sdk/
