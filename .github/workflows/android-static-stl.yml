name: Build OpenCV Android Native (Static STL)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenCV
        uses: actions/checkout@v4

      - name: Download Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip -d $HOME/
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build OpenCV Native
        run: |
          mkdir build_android && cd build_android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAVA=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_apps=OFF \
            ../
          make -j$(nproc)

      - name: Upload libopencv_java4.so
        uses: actions/upload-artifact@v4
        with:
          name: libopencv_java4-arm64-static
          path: build_android/lib/libopencv_java4.so
